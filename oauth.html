<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Hub sign-in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: #f6f5f1; color: #1d1f22; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #15171a; color: #ecebe7; } }
</style>
</head>
<body>
<p id="msg">Finishing sign-in…</p>
<script>
// Google / Microsoft send you back here after sign-in with a short-lived token in the address.
// Hand it to the Finance Hub window that asked for it, then close. Nothing is kept on this page.
(function () {
  var p = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  var r = { type: 'fh-oauth', state: p.get('state'), token: p.get('access_token'), expires: +p.get('expires_in') || 3000,
    error: p.get('error') ? (p.get('error_description') || p.get('error')).replace(/\+/g, ' ') : null };
  history.replaceState(null, '', location.pathname);
  try { if (window.opener) window.opener.postMessage(r, location.origin); } catch (e) { /* opener gone */ }
  try { localStorage.setItem('oauthResult', JSON.stringify(r)); } catch (e) { /* private mode */ }
  document.getElementById('msg').textContent = r.error ? 'Sign-in didn’t finish: ' + r.error : 'Signed in. You can close this window.';
  setTimeout(function () { window.close(); }, r.error ? 4000 : 300);
})();
</script>
</body>
</html>
